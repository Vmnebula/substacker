name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pipx install ruff

      - name: Check lint rules
        run: ruff check --output-format=github .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        env:
          SECRET_KEY: ci_secret_key_not_used_outside_of_tests_32chars
        run: pytest --cov=. --cov-report=term-missing --ignore=tests/test_frontend.py

  boot:
    name: Application boots with default config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import application and assert routes are registered
        env:
          SECRET_KEY: ci_secret_key_not_used_outside_of_tests_32chars
        run: |
          python -c "
          import app
          assert len(app.app.routes) > 0, 'no routes registered'
          print(f'{len(app.app.routes)} routes registered on the {type(app.db).__name__} backend')
          "

  frontend:
    name: Frontend (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Check pages for overflow, CSP violations and missing assets
        env:
          SECRET_KEY: ci_secret_key_not_used_outside_of_tests_32chars
        run: pytest tests/test_frontend.py -q
