<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Substacker - AI Cost Intelligence Platform{% endblock %}</title>
    
    <!-- Meta Tags -->
    <meta name="description" content="{% block meta_description %}Substacker attributes AI spend to the teams, projects and models that caused it, across OpenAI, Anthropic, Gemini and Azure.{% endblock %}">
    <meta name="theme-color" content="#0f172a">
    <link rel="canonical" href="{{ BASE_URL }}{{ request.url.path }}">

    <!-- Open Graph and Twitter. Absolute URLs are required: scrapers do not resolve
         relative paths, so a relative og:image renders no preview at all. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Substacker">
    <meta property="og:url" content="{{ BASE_URL }}{{ request.url.path }}">
    <meta property="og:title" content="{% block og_title %}Substacker - AI Cost Intelligence{% endblock %}">
    <meta property="og:description" content="{% block og_description %}See which teams spend what on AI. Attribution, waste analysis and budget alerts across four providers.{% endblock %}">
    <meta property="og:image" content="{{ BASE_URL }}/static/assets/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Substacker: attribute AI spend across OpenAI, Anthropic, Gemini and Azure">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ self.og_title() }}">
    <meta name="twitter:description" content="{{ self.og_description() }}">
    <meta name="twitter:image" content="{{ BASE_URL }}/static/assets/og-image.jpg">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/landing.css">
    <link rel="stylesheet" href="/static/style.css">
    {% block extra_css %}{% endblock %}
    
    <!-- Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    
    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "tx9c01sb6z");
    </script>
</head>
<body>
    {% block content %}{% endblock %}
    
    <!-- Scripts -->
    <script src="/static/landing.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
