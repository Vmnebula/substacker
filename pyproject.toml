[project]
name = "substacker"
version = "0.1.0"
description = "AI cost attribution and FinOps platform for OpenAI, Anthropic, Gemini and Azure OpenAI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["venv", ".venv", "sample_data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4"]
ignore = [
    "B008",  # FastAPI relies on function calls in argument defaults (Depends, Query)
    "B904",  # re-raising with `from` is not used consistently in this codebase yet
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
